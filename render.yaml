# Render Blueprint — New → Blueprint → this repo.
# API stays on Render. Public site is HostGator: https://theprofitengineer.com/thediamond
# After API is live, build the HostGator copy: cd web && npm run build:hostgator
# then upload web/dist into public_html/thediamond.

services:
  - type: web
    name: diamond-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: diamond-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CORS_ORIGINS
        value: https://theprofitengineer.com,https://www.theprofitengineer.com,https://diamond-web.onrender.com

  - type: web
    name: diamond-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: VITE_API_URL
        fromService:
          type: web
          name: diamond-api
          envVarKey: RENDER_EXTERNAL_URL
